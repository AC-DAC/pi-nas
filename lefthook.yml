# lefthook.yml — install once per clone from the repo root: `lefthook install`
# Needs: brew install lefthook gitleaks
#
# Public repo: secrets must never reach it. .gitignore is the first layer;
# these hooks are the second, stopping a secret before it leaves the Mac.
pre-commit:
  commands:
    gitleaks:
      run: gitleaks git --staged --redact --no-banner --verbose
    no-secret-files:
      # Block .env / key / state files even if .gitignore is ever changed.
      glob: ["*.env", "**/*.env", ".env", "**/.env", "*.pem", "**/*.pem", "*.key", "**/*.key", "*.tfstate", "**/*.tfstate"]
      run: "echo 'Refusing to commit secret-bearing file(s): {staged_files}' && exit 1"

pre-push:
  commands:
    gitleaks-history:
      run: gitleaks git --redact --no-banner --verbose
